<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="images/ChatGPT Image May 9, 2026, 04_53_49 AM.png">
  <title>Reduan's World</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- নেভবার -->
  <header>
        
  <div class="logo">
    <img src="images/ChatGPT Image May 9, 2026, 04_53_49 AM.png " width="100" height="100" alt="logo" >
  </div>
<div class="logo"><h1>Reduan's World </h1></div>
    <nav>
      <a href="user.html">Home</a>
      <a href="product.html">Products</a>
      <a href="profile.html">Profile</a>
      <img 
        src="https://cdn-icons-png.flaticon.com/512/149/149071.png" 
        class="profile-icon" 
        alt="Profile Icon" 
      />
    </nav>
  </header>

  <section class="profile-box">
    <h2>User Profile</h2>
    <img id="profilePic" class="profile-pic" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Profile Picture">
    <input type="file" id="imageInput" accept="image/*" />
    
    <input type="text" id="name" placeholder="Enter Your Name" />
    <input type="text" id="mobile" placeholder="Enter Mobile Number" />
    <input type="text" id="address" placeholder="Enter Address" />

    <button class="save-btn" onclick="saveProfile()">Save</button>
    <button class="update-btn" onclick="updateProfile()">Update</button>
  </section>

  <script>
 // লগইন চেক
    if(localStorage.getItem("isLoggedIn") !== "true") {
      window.location.href = "index.html";
    }

    // ছবি প্রিভিউ
    const imageInput = document.getElementById("imageInput");
    const profilePic = document.getElementById("profilePic");

    imageInput.addEventListener("change", function(){
      const file = this.files[0];
      const reader = new FileReader();
      reader.onload = function(){
        profilePic.src = reader.result;
        localStorage.setItem("profileImage", reader.result);
      }
      reader.readAsDataURL(file);
    });

    // প্রোফাইল সেভ
    function saveProfile(){
      const name = document.getElementById("name").value;
      const mobile = document.getElementById("mobile").value;
      const address = document.getElementById("address").value;

      localStorage.setItem("profileName", name);
      localStorage.setItem("profileMobile", mobile);
      localStorage.setItem("profileAddress", address);

      alert("Profile Saved!");
    }

    // প্রোফাইল আপডেট
    function updateProfile(){
      saveProfile(); // same function as save (for simplicity)
      alert("Profile Updated!");
    }

    // পেজ লোড হলে ডেটা লোড
    window.onload = function() {
      const savedName = localStorage.getItem("profileName");
      const savedMobile = localStorage.getItem("profileMobile");
      const savedAddress = localStorage.getItem("profileAddress");
      const savedImage = localStorage.getItem("profileImage");

      if (savedName) {
        document.getElementById("name").value = savedName;
      }
      if (savedMobile) {
        document.getElementById("mobile").value = savedMobile;
      }
      if (savedAddress) {
        document.getElementById("address").value = savedAddress;
      }
      if (savedImage) {
        profilePic.src = savedImage;
      }
    }
  </script>

</body>
</html>
